name: Beta report
description: Send your two-week beta report and feedback.
title: "Beta report: "
labels: ["beta-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing DotShield. Issues here are **public**.
        Paste only what DotShield prints for sharing: the summary between the "copy from here" markers at the end of every `dotshield scan`, and, after the two-week beta, the output of `dotshield guard report --days 14 --json`. Both hold counts and timings only, never a file path, file contents or a secret value. Read them before you paste them. We never ask for secret values or your code.
        **Never paste** `~/.dotshield/log/guard.jsonl`, scan output, or anything from your projects.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dotshield version`
      placeholder: dotshield v0.1.0-beta.3 (d1a9c09)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: checkboxes
    id: agents
    attributes:
      label: Agents you used it with
      options:
        - label: Claude Code
        - label: Cursor
  - type: textarea
    id: scan
    attributes:
      label: Scan summary
      description: The lines between "copy from here" and "to here" at the end of `dotshield scan`
      render: text
  - type: textarea
    id: report
    attributes:
      label: Guard report (after the two-week beta)
      description: Output of `dotshield guard report --days 14 --json`
      render: json
  - type: textarea
    id: feedback
    attributes:
      label: Which findings were wrong, and what got in your way, surprised you or was missing?
      description: Name findings by their rule (for example generic-secret-assignment), never by value.
  - type: dropdown
    id: keep
    attributes:
      label: Will you keep it on?
      options: ["Yes, in enforce mode", "Yes, in watch mode", "No"]
